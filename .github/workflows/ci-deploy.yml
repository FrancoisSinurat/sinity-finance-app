name: CI & Deploy VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sinity-finance-app-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 43.134.53.204
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/myproduct/sinity-finance-app
            git fetch origin master
            git reset --hard origin/master
            chmod +x deploy/vps-deploy.sh
            ./deploy/vps-deploy.sh
