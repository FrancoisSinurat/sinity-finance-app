name: CI & Deploy VPS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: sinity-finance-app-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_BASE_URL: https://api.sinityspace.my.id/sinify
  NEXT_PUBLIC_AUTH_API_BASE_URL: https://api.sinityspace.my.id/sinify
  NEXT_PUBLIC_AUTH_MOCK_ON_BACKEND_ERROR: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Verify Node.js version
        run: |
          node -v
          npm -v
          node -e "const major = +process.versions.node.split('.')[0]; if (major < 22) { console.error('Node.js 22+ required'); process.exit(1); }"

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Build static export
        run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/myproduct/sinity-finance-app
            git fetch origin master
            git reset --hard origin/master
            chmod +x deploy/vps-deploy.sh
            ./deploy/vps-deploy.sh
